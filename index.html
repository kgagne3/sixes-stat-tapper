<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sixes Stat Tapper</title>
<meta name="theme-color" content="#0b5d4b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sixes Stats">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Phone first (iPhone mini) and wider on iPad. Score, five event types with a penalty row, goalies, live log, box score. */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --ink:#14201b; --muted:#5d6b64; --line:#d9ded9;
  --a:#0b5d4b; --b:#b4531a; --bad:#b3261e; --ok:#1d7a3e;
  --disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --panel:#18211d; --ink:#e8efea; --muted:#95a39b; --line:#2b3832;
  --a:#3fb596; --b:#ee9358; --bad:#ff8a80; --ok:#6fd08c; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1512; --panel:#18211d; --ink:#e8efea; --muted:#95a39b; --line:#2b3832;
  --a:#3fb596; --b:#ee9358; --bad:#ff8a80; --ok:#6fd08c; color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px}
body{padding:8px 12px calc(20px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
@media (min-width:700px){body{max-width:920px;padding:16px 24px}}
button,select,input{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--a);outline-offset:2px}
h2{font-family:var(--disp);font-size:16px;letter-spacing:.04em;text-transform:uppercase;margin:14px 0 6px;font-weight:700}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between}
.info{font-size:12px;color:var(--muted);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board{font-size:12px;color:var(--muted);margin:6px 0 2px;min-height:16px}
.board .ok{color:var(--ok);font-weight:700} .board .bad{color:var(--bad);font-weight:700}
.score{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.team{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;border-top:5px solid var(--c)}
.team input{width:100%;border:0;background:transparent;font:700 14px var(--body);color:var(--ink);padding:2px 0}
.team .n{font:700 40px/1 var(--disp);font-variant-numeric:tabular-nums}
.team .s{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.gbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.gbar button{padding:7px 10px;border-radius:8px;border:2px solid var(--c);background:var(--panel);font-weight:700;font-size:13px;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.periods{display:flex;gap:4px;margin:8px 0}
.periods button{flex:1;padding:7px 0;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:14px}
.periods button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ev{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ev button{min-height:58px;border-radius:10px;border:2px solid var(--c);background:var(--panel);font:700 22px var(--disp);letter-spacing:.03em;text-transform:uppercase}
.ev .goal{min-height:76px;background:var(--cf);color:var(--con);font-size:28px}
.ev button:active{transform:scale(.97)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ghost{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:14px}
@media (min-width:700px){
  .team .n{font-size:60px} .ev button{min-height:84px;font-size:26px} .ev .goal{min-height:104px;font-size:34px}
  .gbar button{font-size:15px} .periods button{font-size:15px}
}
.log{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:84px 1fr auto;gap:8px;align-items:center;text-align:left;width:100%;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:8px}
.item .t{font:700 30px/1 var(--disp);font-variant-numeric:tabular-nums}
.item .t.miss{color:var(--bad)}
.item .at{display:block;font:400 11px var(--body);color:var(--muted);margin-top:3px}
.item .p{color:var(--muted);font-size:12px}
.empty{color:var(--muted);padding:10px 0}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:5px 6px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font:600 11px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
caption{caption-side:top;text-align:left;font-weight:700;padding:6px 0;color:var(--ink)}
.col{width:100%;height:44px;padding:3px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.ov{position:fixed;inset:0;display:none;background:rgba(0,0,0,.45);z-index:10}
.ov.on{display:flex;align-items:flex-end;justify-content:center}
.card{background:var(--panel);width:100%;max-width:640px;border-radius:14px 14px 0 0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));max-height:96%;overflow:auto}
@media (min-width:700px){.card{max-width:640px;margin-bottom:auto;margin-top:auto;border-radius:14px}.ov.on{align-items:center}}
.card h3{margin:0 0 6px;font:700 20px var(--disp);text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sub{color:var(--muted);font-size:12px;margin:-2px 0 8px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.teams button{padding:10px 6px;border-radius:8px;border:2px solid var(--line);background:var(--bg);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.teams button[aria-pressed="true"]{background:var(--cf);border-color:var(--c);color:var(--con)}
.pers{display:flex;gap:4px;margin-bottom:6px}
.pers button{flex:1;padding:6px 0;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:14px}
.pers button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:6px;margin-bottom:6px}
.fields button{padding:5px 8px;border-radius:8px;border:2px solid var(--line);background:var(--bg);text-align:left}
.fields button small{display:block;font-size:11px;color:var(--muted)}
.fields button b{font:700 22px/1.1 var(--disp);font-variant-numeric:tabular-nums}
.fields button[aria-pressed="true"]{border-color:var(--ink);background:var(--panel);box-shadow:0 0 0 2px var(--ink)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chips button{min-height:46px;border-radius:8px;border:2px solid var(--c);background:var(--bg);font:700 22px var(--disp)}
.chips button:disabled{opacity:.25}
.chips .w{font:700 14px var(--body);border-color:var(--line)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad button{min-height:48px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font:700 24px var(--disp)}
.pad .w{font:700 15px var(--body)}
.act{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:8px}
.act.nx{grid-template-columns:1fr 1fr 2fr}
.act button{min-height:48px;border-radius:8px;border:0;font-weight:700;font-size:16px}
.act .save{background:var(--ink);color:var(--bg)}
.act .cancel{background:var(--bg);border:1px solid var(--line)}
.mv{color:var(--ink)}
.del{color:var(--bad);background:none;border:0;font-weight:700;font-size:14px;padding:6px}
.lbl{font-size:12px;color:var(--muted);margin:8px 0 3px;text-transform:uppercase;letter-spacing:.04em}
.note{font-size:13px;color:var(--muted);margin:4px 0}
.card select,.card input[type=text],.card input[type=url],.card input[inputmode]{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
.radd{display:flex;gap:6px;align-items:stretch}
.radd input{flex:1;min-width:0}
.radd .ghost{min-height:42px;padding:8px 14px}
.rc{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 2px}
.rc button{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font:700 15px var(--body)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{padding:12px 0;border-radius:8px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:16px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gteam{border:1px solid var(--line);border-left:5px solid var(--c);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.gname{font-weight:700}
.gcur{color:var(--muted);font-size:13px;margin:2px 0 6px}
.gbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.gbtns button{padding:10px 6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.gin{display:flex;gap:6px;margin-top:6px}
.gin input{flex:1;min-width:0}
.gin button{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.toast{color:var(--muted);font-size:13px;min-height:18px;margin-top:6px}
@media (prefers-reduced-motion:no-preference){.card{animation:up .15s ease-out}@keyframes up{from{transform:translateY(20px);opacity:.6}}}
</style>
</head>
<body>

<div class="top">
  <div class="info" id="info">Tap Setup to start a game</div>
</div>
<div class="board" id="board"></div>
<div class="score" id="score"></div>
<div class="gbar" id="gbar"></div>
<div class="periods" id="periods" role="group" aria-label="Quarter"></div>

<div class="ev" id="ev">
  <button class="goal" style="--c:var(--aline);--cf:var(--a);--con:var(--aon)" data-t="goal" data-tm="0">Goal</button>
  <button class="goal" style="--c:var(--bline);--cf:var(--b);--con:var(--bon)" data-t="goal" data-tm="1">Goal</button>
  <button style="--c:var(--aline);--cf:var(--a);--con:var(--aon)" data-t="save" data-tm="0">Save</button>
  <button style="--c:var(--bline);--cf:var(--b);--con:var(--bon)" data-t="save" data-tm="1">Save</button>
  <button style="--c:var(--aline);--cf:var(--a);--con:var(--aon)" data-t="wide" data-tm="0">Wide</button>
  <button style="--c:var(--bline);--cf:var(--b);--con:var(--bon)" data-t="wide" data-tm="1">Wide</button>
  <button style="--c:var(--aline);--cf:var(--a);--con:var(--aon)" data-t="gb" data-tm="0">Ground ball</button>
  <button style="--c:var(--bline);--cf:var(--b);--con:var(--bon)" data-t="gb" data-tm="1">Ground ball</button>
  <button style="--c:var(--aline);--cf:var(--a);--con:var(--aon)" data-t="pen" data-tm="0">Penalty</button>
  <button style="--c:var(--bline);--cf:var(--b);--con:var(--bon)" data-t="pen" data-tm="1">Penalty</button>
</div>
<div class="row">
  <button class="ghost" id="undo">Undo last</button>
  <button class="ghost" id="copy">Copy CSV</button>
  <button class="ghost" id="setupBtn">Setup</button>
  <button class="ghost" id="reset">New game</button>
</div>
<div class="toast" id="toast" aria-live="polite"></div>

<h2>Log</h2>
<div class="log" id="log"></div>

<h2>Box score</h2>
<div id="box"></div>

<div id="sheet" class="ov" role="dialog" aria-modal="true" aria-label="Enter event"><div class="card" id="card"></div></div>
<div id="gsheet" class="ov" role="dialog" aria-modal="true" aria-label="Goalies"><div class="card" id="gcard"></div></div>
<div id="ssheet" class="ov" role="dialog" aria-modal="true" aria-label="Game setup"><div class="card" id="scard"></div></div>

<script src="data/pointbench.js"></script>
<script>
var LABEL={goal:"Goal",save:"Save",wide:"Wide",post:"Post",blocked:"Blocked",gb:"Ground ball",pen:"Penalty"};
var PENS=["30 sec","1 min","2 min"]; // penalty durations
var PTYPES=["Slash","Hold","Cross-check","Push","Trip","Illegal check","Other"];
var KEY="sixes-stat-tapper-v1", SKEY="sixes-stat-settings";
var S={names:["Home","Away"],teams:["",""],field:"",gameCode:"",period:1,events:[],nid:1,rosters:["",""],goalies:["",""],colors:["#ffffff","#0b5d4b"]};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.events)S=Object.assign(S,p);}}catch(e){}
var SET={feedUrl:"wss://apps.playit.pt/socket?app=world-lacrosse-2026"};
try{var sraw=localStorage.getItem(SKEY);if(sraw)SET=Object.assign(SET,JSON.parse(sraw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function saveSet(){try{localStorage.setItem(SKEY,JSON.stringify(SET));}catch(e){}}
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function col(t){return t===0?"var(--aline)":"var(--bline)"}
function tv(i){return "--c:"+col(i)+";--cf:var("+(i?"--b":"--a")+");--con:var("+(i?"--bon":"--aon")+")"}
function lum(h){var n=parseInt(h.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;function f(c){return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4)}return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b)}
/* Team colours: fill, readable text on the fill, and a border colour that stays visible on white. */
function applyColours(cols){
  var root=document.documentElement.style;
  [0,1].forEach(function(i){
    var c=cols[i]||(i?"#0b5d4b":"#ffffff"),l=lum(c),pre=i?"--b":"--a";
    root.setProperty(pre,c);
    root.setProperty(pre+"on",l>0.5?"#14201b":"#ffffff");
    root.setProperty(pre+"line",l>0.8?"#5d6b64":c);
  });
}
function fmtTime(d){if(!d)return"";var m=d.length>2?d.slice(0,-2):"0",s=d.slice(-2);if(s.length<2)s="0"+s;return m+":"+s}
function toast(m){$("toast").textContent=m;clearTimeout(toast.h);toast.h=setTimeout(function(){$("toast").textContent=""},3500)}
function hhmmss(ms){var d=new Date(ms);function p(n){return n<10?"0"+n:""+n}return p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds())}
function vib(){try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}}
function numsSort(list){var seen={};return list.filter(function(x){if(!x||seen[x])return false;seen[x]=1;return true}).sort(function(a,b){return a-b})}
function roster(t){return numsSort(String(S.rosters[t]||"").split(/\D+/))}

/* ---------- Pointbench data (window.POINTBENCH, from data/pointbench.js) ---------- */
function PB(){return window.POINTBENCH||{teams:{},games:[]}}
function teamName(id){var t=PB().teams[id];return t?t.name:(id||"Home")}
function findGame(a,b){var gs=PB().games;for(var k=0;k<gs.length;k++){var g=gs[k];if((g.home===a&&g.away===b)||(g.home===b&&g.away===a))return g}return null}
function findGameId(id){var gs=PB().games;for(var k=0;k<gs.length;k++){if(gs[k].gameId===id)return gs[k]}return null}

/* ---------- scoreboard feed (Playit): read only ---------- */
var FEED={ws:null,status:"off",devices:{},lastMsg:0,retry:null,map:{},lastPeriod:{}};
var PENDING_GOALIES=null; // goalie prompt waiting until an open sheet closes
function flushPending(){
  if(PENDING_GOALIES&&!$("sheet").classList.contains("on")&&!$("ssheet").classList.contains("on")){var t=PENDING_GOALIES;PENDING_GOALIES=null;openGoalies(t)}
}
/* At game start, take the quarter from the live reading right away (no goalie prompt; the start prompt covers it). */
function syncPeriodNow(){
  if(!S.field)return;
  var L=liveFor(S.field);
  if(!L||!L.ok||!L.period)return;
  var p=Math.min(5,Math.max(1,+L.period));
  S.period=p;FEED.lastPeriod[S.field]=p;save();renderAll();
}
/* The quarter follows the scoreboard while a live reading is available. Manual Q buttons still work. */
function syncPeriod(){
  if(!S.field||!S.teams[0])return;
  var L=liveFor(S.field);
  if(!L||!L.ok||!L.period)return;
  var p=Math.min(5,Math.max(1,+L.period));
  var last=FEED.lastPeriod[S.field];
  FEED.lastPeriod[S.field]=p;
  if(last===undefined){ if(S.period!==p){S.period=p;save();renderAll()} return }
  if(last===p)return;
  S.period=p;save();
  var busy=$("sheet").classList.contains("on")||$("ssheet").classList.contains("on");
  if(busy){PENDING_GOALIES="Q"+p+" goalies";renderAll();return}
  renderAll();openGoalies("Q"+p+" goalies");
}
function streamOf(f){return f==="F2"?2:1}
function fetchMap(f){
  return fetch("https://apps.playit.pt/Sixes-Championships-2026/api/broadcast?stream="+streamOf(f))
    .then(function(r){return r.json()})
    .then(function(d){var s=d.streams&&d.streams[String(streamOf(f))];
      if(s){FEED.map[f]={panelId:s.panelId,shotId:s.shotId,swap:!!s.swapPanel,gameId:s.gameId?+s.gameId:null}}
      renderBoard();return FEED.map[f]||null})
    .catch(function(){return null});
}
function connectFeed(){
  clearTimeout(FEED.retry);
  if(FEED.ws){var old=FEED.ws;FEED.ws=null;try{old.close()}catch(e){}}
  if(!SET.feedUrl){FEED.status="off";renderBoard();return}
  FEED.status="connecting";renderBoard();
  try{
    var ws=new WebSocket(SET.feedUrl);FEED.ws=ws;
    ws.onopen=function(){if(FEED.ws===ws){FEED.status="connected";renderBoard()}};
    ws.onmessage=function(ev){onFeed(ev.data)};
    ws.onclose=function(){if(FEED.ws!==ws)return;FEED.status="lost";renderBoard();FEED.retry=setTimeout(connectFeed,3000)};
    ws.onerror=function(){};
  }catch(e){FEED.status="lost";renderBoard()}
}
function onFeed(data){
  try{
    var m=JSON.parse(data);
    if(m.type!=="clocks:state"||m.schema!=="playit-clocks-live-v1")return;
    var bytes=Uint8Array.from(atob(m.payload),function(c){return c.charCodeAt(0)});
    var st=JSON.parse(new TextDecoder().decode(bytes));
    if(st.schema!=="playit-clocks-v2"||!st.clocks)return;
    var now=Date.now();
    (st.clocks.devices||[]).forEach(function(d){FEED.devices[d.id]=Object.assign({},d,{recv:now})});
    FEED.lastMsg=now;
    renderBoard();
    syncPeriod();
  }catch(e){}
}
/* A reading counts only when the reader says live, is under 1.5 s old and its source reported within 3 s. */
function liveFor(f){
  var m=FEED.map[f];if(!m)return null;
  var d=FEED.devices[m.panelId];if(!d)return null;
  var now=Date.now(),age=(d.ageMs||0)+(now-d.recv);
  var ok=d.status==="live"&&age<=1500&&(now-d.recv)<3000;
  return {ok:ok,clock:d.clock,home:d.home,guest:d.guest,period:d.period,swap:m.swap,dev:d};
}
function liveDigits(){var L=liveFor(S.field);if(!L||!L.ok||!L.clock)return"";return String(L.clock).replace(/\D/g,"")}

/* ---------- main render ---------- */
function tally(){
  var T=[{g:0,sh:0,sog:0,sv:0,gb:0},{g:0,sh:0,sog:0,sv:0,gb:0}];
  S.events.forEach(function(e){
    if(e.type==="pen")return;
    var t=T[e.team];if(e.type==="gb"){t.gb++;return}t.sh++;
    if(e.type==="goal"){t.g++;t.sog++}
    if(e.type==="save"){t.sog++;T[1-e.team].sv++}
  });
  return T;
}
function renderScore(){
  var T=tally(),h="";
  [0,1].forEach(function(i){
    h+='<div class="team" style="--c:'+col(i)+'"><input id="nm'+i+'" aria-label="Team '+(i+1)+' name" value="'+esc(S.names[i])+'">'+
       '<div class="n">'+T[i].g+'</div><div class="s">Goals</div></div>';
  });
  $("score").innerHTML=h;
  [0,1].forEach(function(i){$("nm"+i).addEventListener("input",function(ev){S.names[i]=ev.target.value||(i?"Away":"Home");save();renderInfo();renderBox();renderLog()})});
}
function renderInfo(){
  $("info").textContent=S.teams[0]?((S.field?S.field+" · ":"")+(S.gameCode?S.gameCode+" · ":"")+S.names[0]+" v "+S.names[1]):"Tap Setup to start a game";
}
function renderBoard(){
  var el=$("board"),h="";
  if(!SET.feedUrl){el.innerHTML="Scoreboard: not connected (add the socket in Setup)";return}
  if(!S.field){el.innerHTML="Scoreboard: choose a field in Setup";return}

  if(!L.ok){el.innerHTML="Scoreboard: stale reading for "+S.field;return}
  var T=tally(),bh=L.swap?L.guest:L.home,ba=L.swap?L.home:L.guest;
  var same=(bh===T[0].g&&ba===T[1].g);
  h="Board "+esc(S.names[0])+" "+bh+" – "+ba+" "+esc(S.names[1])+" · "+esc(L.clock)+" Q"+L.period+" · "+
    (same?'<span class="ok">✓ matches log</span>':'<span class="bad">≠ log '+T[0].g+'–'+T[1].g+'</span>');

}

function renderBox(){

        if(e.type==="goal"&&e.assist&&e.assist!=="none"){var a=e.assist;P[a]=P[a]||{g:0,a:0,sh:0,sog:0,gb:0};P[a].a++}

    h+='</tbody></table>';

      gk.forEach(function(k){h+='<tr><td>#'+esc(k)+'</td><td>'+G[k].sv+'</td></tr>'});
      h+='</tbody></table>';

/* ---------- event entry sheet ---------- */
var D=null;
function fieldsOf(d){
  var f=d.type==="goal"?["time","shooter","assist"]:d.type==="save"?(d.skipGoalie?["shooter"]:["shooter","goalie"]):d.type==="pen"?["time","shooter","ptype","minutes"]:["shooter"];
  if(d.live)f=f.filter(function(x){return x!=="time"});

}
var FL={shooter:"Shooter",assist:"Assist",goalie:"Goalie",time:"Time",ptype:"Type",minutes:"Minutes"};
function open(type,ev,team){
  if(ev){
    D={id:ev.id,type:ev.type,team:ev.team,period:ev.period,shooter:ev.shooter||"",assist:ev.assist||"",goalie:ev.goalie||"",time:ev.time||"",ptype:ev.ptype||"",minutes:ev.minutes||"",at:ev.at,board:ev.board,live:false,skipGoalie:false};
  }else{
    D={id:0,type:type,team:team,period:S.period,shooter:"",assist:"",goalie:"",time:"",ptype:"",minutes:"",at:Date.now(),board:liveDigits(),live:false,skipGoalie:false};

  }
  D.f=fieldsOf(D)[0];
  drawSheet();$("sheet").classList.add("on");
}
function close(){$("sheet").classList.remove("on");D=null;flushPending()}
function drawSheet(){
  var fs=fieldsOf(D);
  var h='<h3><span style="color:'+col(D.team)+'">'+(D.id?"Edit ":"")+LABEL[D.type]+' · '+esc(S.names[D.team])+'</span>'+(D.id?'<span><button class="del mv" id="up" aria-label="Move earlier">Earlier</button><button class="del mv" id="dn" aria-label="Move later">Later</button><button class="del" id="del">Delete</button></span>':'')+'</h3>';
  if(D.live)h+='<div class="sub">Time '+fmtTime(D.time)+' from the scoreboard</div>';

  h+='</div>';
  if(D.id){h+='<div class="teams">';[0,1].forEach(function(i){h+='<button style="'+tv(i)+'" data-team="'+i+'" aria-pressed="'+(D.team===i)+'">'+esc(S.names[i])+'</button>'});h+='</div>';}
  h+='<div class="fields">';

    h+='<button data-f="'+f+'" aria-pressed="'+(D.f===f)+'"><small>'+(f==="shooter"&&(D.type==="gb"||D.type==="pen")?"Player":FL[f])+(f==="goalie"?" (opp.)":"")+'</small><b>'+esc(v||"–")+'</b></button>';
  });
  h+='</div>';
  var rt=D.f==="goalie"?1-D.team:D.team,ros=(D.f==="time"||D.f==="minutes"||D.f==="ptype")?[]:roster(rt);
  if(D.f==="minutes"){
    h+='<div class="chips" style="grid-template-columns:repeat(3,1fr)">';
    PENS.forEach(function(t){h+='<button class="w" data-n="'+esc(t)+'">'+esc(t)+'</button>'});
    h+='</div>';
  }
  else if(D.f==="ptype"){
    h+='<div class="chips" style="grid-template-columns:repeat(2,1fr)">';
    PTYPES.forEach(function(t){h+='<button class="w" data-n="'+esc(t)+'">'+esc(t)+'</button>'});
    h+='</div>';
  }
  else if(ros.length&&!D.pad){
    h+='<div class="chips" style="--c:'+col(rt)+'">';
    ros.forEach(function(n){h+='<button data-n="'+n+'"'+(D.f==="assist"&&n===D.shooter?' disabled':'')+'>'+n+'</button>'});
    if(D.f==="assist")h+='<button class="w" data-n="none">None</button>';
    h+='<button class="w" id="pad">Other #</button></div>';
  }else{
    h+='<div class="pad">';
    "123456789".split("").forEach(function(d){h+='<button data-k="'+d+'">'+d+'</button>'});
    h+='<button class="w" data-k="clr">Clear</button><button data-k="0">0</button><button class="w" data-k="'+(D.f==="assist"?"none":"back")+'">'+(D.f==="assist"?"None":"⌫")+'</button></div>';
  }
  var nx=fs.indexOf(D.f)<fs.length-1;
  h+='<div class="act'+(nx?' nx':'')+'"><button class="cancel" id="cancel">Cancel</button>'+(nx?'<button class="cancel" id="next">Next</button>':'')+'<button class="save" id="ok">Save '+LABEL[D.type]+'</button></div>';

function chip(n){
  vib();D[D.f]=n;
  var fs=fieldsOf(D),i=fs.indexOf(D.f);
  if(i<fs.length-1){D.f=fs[i+1];D.pad=false;drawSheet()}
  else if(!D.id){commit()}
  else drawSheet();
}
function pressKey(k){vib();
  var f=D.f,v=D[f]||"";
  if(k==="clr")v="";
  else if(k==="back")v=v==="none"?"":v.slice(0,-1);
  else if(k==="none")v="none";
  else{
    if(v==="none")v="";
    var max=f==="time"?4:2;
    if(v.length<max)v+=k;
    if(f==="time"&&v.length===4&&+v.slice(0,2)>59)v=v.slice(0,3);
  }
  D[f]=v;
  var fs=fieldsOf(D),i=fs.indexOf(f);
  if((f==="time"?v.length===4:(v.length===2||v==="none"))&&i<fs.length-1){D.f=fs[i+1];D.pad=false}

}
function down(){return S.down!==false}
function secs(t){return (+t.slice(0,-2)||0)*60+(+t.slice(-2)||0)}
function pv(t){return down()?-secs(t):secs(t)}
/* Log keeps the order events were tapped in. */
function place(e){S.events.push(e)}
function move(id,d){

function commit(){

  var e={id:D.id||S.nid++,type:D.type,team:D.team,period:D.period,shooter:D.shooter,assist:D.type==="goal"?D.assist:"",goalie:D.type==="save"?D.goalie:"",time:timed?D.time:"",ptype:D.type==="pen"?(D.ptype||""):"",minutes:D.type==="pen"?(D.minutes||""):"",at:D.at,board:D.board};
  if(D.id){

function teamOptions(sel){

       '<div class="rc" id="src'+i+'">'+SU.r[i].map(function(n){return '<button data-rm="'+i+'" data-n="'+n+'">'+n+' ✕</button>'}).join("")+'</div>';
  });

function applyRosterFor(){
  SU.r=[PB().teams[SU.home]?numsSort(PB().teams[SU.home].roster.map(function(p){return p.number})):[],
        PB().teams[SU.away]?numsSort(PB().teams[SU.away].roster.map(function(p){return p.number})):[]];

function startGame(){
  if(!SU.field||!SU.home||!SU.away||SU.home===SU.away){toast("Pick a field and two different teams.");return}

}

$("ssheet").addEventListener("click",function(ev){

});
$("copy").addEventListener("click",function(){
  var rows=[["period","game_time","board_clock","tapped_at","team","event","shooter","assist","goalie","penalty","minutes"]];
  S.events.forEach(function(e){rows.push([e.period,fmtTime(e.time),fmtTime(e.board),e.at?hhmmss(e.at):"",S.names[e.team],e.type,e.shooter,e.assist==="none"?"":e.assist,e.goalie,e.ptype||"",e.minutes||""])});
  var csv=rows.map(function(r){return r.map(function(c){c=String(c==null?"":c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(",")}).join("\n");
  try{navigator.clipboard.writeText(csv).then(function(){toast("CSV copied. Paste into a sheet.")},function(){toast("Copy blocked. Press and hold the log to select.")})}
  catch(e){toast("Copy blocked on this device.")}
});

renderAll();
if(!S.teams[0])openSetup();
connectFeed();
if(S.field)fetchMap(S.field);
setInterval(function(){if(S.field)fetchMap(S.field)},60000);
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}
</script>
</body>
